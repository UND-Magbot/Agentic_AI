# 150 서버(운영) 전용 오버라이드 — 기본 docker-compose.yml 위에 겹쳐 쓴다.
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# - 외부 공개는 Caddy(80/443, https://${PUBLIC_DOMAIN})만. 공유기에서 80·443 → 이 서버로 포워딩.
# - 공개 도메인은 DuckDNS(duckdns 서비스가 IP 갱신). .env: PUBLIC_DOMAIN·DUCKDNS_SUBDOMAIN·DUCKDNS_TOKEN
# - DB·Ollama 는 호스트(192.168.0.150)의 것을 그대로 쓴다(.env 의 DATABASE_URL / OLLAMA_BASE_URL).
# - Redis·MinIO·backend·embed 포트는 외부에 열지 않는다(컨테이너 네트워크 안에서만 사용).
# - Codex 는 같은 서버 docker-codeserver 의 codex-bridge 를 그 compose 네트워크로 직접 호출한다
#   (.env: CODEX_BRIDGE_URL=http://codex-bridge:10120).

services:
  redis:
    ports: !reset []

  minio:
    ports: !reset []

  embed:
    ports: !reset []

  backend:
    ports: !override
      - "127.0.0.1:8002:8000"
    networks:
      - und_cortex_net
      - codex_net

  frontend:
    # 운영 모드: 이미지에 복사된 소스로 빌드 후 next start. (dev 의 소스 바인드 마운트는 쓰지 않음)
    # NODE_ENV=production 이면 로그인 쿠키가 secure → HTTPS(도메인)로만 로그인 유지.
    environment:
      NODE_ENV: production
    command: ["sh", "-c", "npm run build && exec npm run start -- --hostname 0.0.0.0 --port 3000"]
    volumes: !reset []
    ports: !override
      - "127.0.0.1:3010:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s

  caddy:
    image: caddy:2.10
    container_name: und_cortex_caddy
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN 을 .env 에 설정하세요}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - und_cortex_net

  duckdns:
    # 공인 IP 를 DuckDNS(${DUCKDNS_SUBDOMAIN}.duckdns.org)에 5분마다 갱신. 회사 도메인(CNAME)으로 옮기면 제거.
    # iptime.org 는 CAA(issue ";")로 인증서 발급이 막혀 있어 DuckDNS 를 쓴다.
    image: alpine:3.20
    container_name: und_cortex_duckdns
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:?DUCKDNS_SUBDOMAIN 을 .env 에 설정하세요}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DUCKDNS_TOKEN 을 .env 에 설정하세요}
    # 응답(OK/KO)만 기록 — 토큰이 들어간 URL 은 로그에 남기지 않는다.
    command:
      - sh
      - -c
      - |
        while true; do
          r=$$(wget -qO- "https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=" 2>/dev/null || echo ERR)
          echo "$$(date -Iseconds) duckdns update: $$r"
          sleep 300
        done
    networks:
      - und_cortex_net

volumes:
  caddy_data:
  caddy_config:

networks:
  codex_net:
    external: true
    name: code-server_default
