<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  서버에서 엑셀 → PDF(LibreOffice) 로 바꿀 때 Windows 글꼴 대신 쓸 글꼴(사용자 2026-10-07: 만든 문서가 원본 양식과 달라 보이면 안 됨).
  - 맑은 고딕(견적서·거래명세서 글꼴) → 나눔고딕: 한글·숫자·영문을 모두 같은 글꼴로(없으면 숫자만 DejaVu 로 섞여 보였다).
  - Calibri(엑셀 기본 글꼴 — 열 너비 계산 기준)은 크기가 같은 Carlito 가 맡는다(fonts-crosextra-carlito).
    DejaVu 로 대신하면 숫자 폭이 넓어 열이 넓게 계산되고, 쪽 맞춤 배율이 줄어 문서 전체가 작게 인쇄됐다.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>맑은 고딕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Malgun Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
</fontconfig>
